name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    name: Dashboard harness (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check scripts dashboard
      - name: Regenerate analysis + state
        run: |
          python scripts/analyze_dotnet.py
          python scripts/build_state.py
      - name: Tests
        run: pytest -q scripts

  java_target:
    name: Java target skeleton compiles and tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile skeleton
        run: mvn -B -q -f java_target/pom.xml compile
      - name: Test skeleton
        run: mvn -B -q -f java_target/pom.xml test
